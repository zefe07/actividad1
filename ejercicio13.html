<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 13 - Verificador de Edad para Votar</title>
    <link rel="stylesheet" href="css/ejercicio13.css">
</head>
<body>
    <div class="contenedor">
        <h1>Verificador de Edad</h1>
        <p class="subtitulo">Comprueba si puedes votar según tu edad</p>

        <div class="grupo-formulario">
            <label for="edad">Tu edad</label>
            <input type="text" id="edad">
        </div>

        <button type="button" id="btnVerificar">Verificar</button>

        <div class="grupo-formulario">
            <label for="resultado">Resultado</label>
            <input type="text" id="resultado" readonly>
        </div>

        <p id="mensajeError" class="error"></p>
    </div>

    <script src="js/ejercicio13.js"></script>
</body>
</html>
